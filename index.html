<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Briscola - Animated Edition</title>
    <style>
        /* Responsive sizing tokens.
           Card widths are bound by BOTH viewport width and viewport height
           (via min(vw, vh)) so cards scale down correctly in short/landscape
           viewports, not just narrow/portrait ones. Player cards get the
           largest share since those are the only cards the person must tap. */
        :root {
            --player-card-w: clamp(76px, min(24vw, 30vh), 96px);
            --ai-card-w: clamp(46px, min(13vw, 17vh), 96px);
            --table-card-w: clamp(52px, min(15vw, 19vh), 96px);
            --card-ratio: 1.8125; /* 174 / 96 from the original fixed card size */
        }

        * { box-sizing: border-box; }

        /* Root scroller: pin to the viewport so nothing above body can
           introduce a scrollbar either. */
        html {
            height: 100%;
            overflow: hidden;
        }

        /* The Table */
        body {
            background: radial-gradient(circle at center, #2E7D32 0%, #1B5E20 60%, #0A3D11 100%);
            box-shadow: inset 0 0 150px rgba(0,0,0,0.9);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* The board is fully sized via vh-based clamps (see the card
               width tokens above and the short-viewport media query below)
               to fit within one screen at any size or orientation, so the
               page never needs to scroll — keeps it feeling like a native
               app rather than a webpage. */
            overflow: hidden;
        }

        /* Hosts the HUD, stats bar, and board. Normally laid out at
           scale(1) exactly as before; on the rare viewport too short for
           even the minimum card sizes, fitToViewport() (JS) applies a
           uniform scale-down here so everything shrinks together and
           stays fully visible instead of being clipped or scrollable. */
        #viewport-fit {
            width: 100%;
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform-origin: top center;
        }

        /* HUD & Controls */
        .hud {
            width: 100%;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
            padding: clamp(8px, 2vh, 15px) 8px clamp(10px, 3vh, 30px) 8px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: clamp(6px, 2vw, 20px);
        }

        .hud-controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: clamp(6px, 1.5vw, 15px);
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }
        
        select, button {
            font-family: inherit;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: clamp(6px, 1vh, 8px) clamp(10px, 2vw, 15px);
            font-size: clamp(12px, 3vw, 14px);
            border-radius: 20px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.2s;
        }
        
        select:hover, button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        select option { background: #1B5E20; color: white; }

        .score-badge {
            background: rgba(0,0,0,0.6);
            padding: clamp(6px, 1.2vh, 8px) clamp(12px, 3vw, 20px);
            border-radius: 20px;
            font-weight: bold;
            font-size: clamp(13px, 3.2vw, 16px);
            letter-spacing: 1px;
            border: 1px solid rgba(255,215,0,0.3);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            white-space: nowrap;
        }

        /* On mobile, the AI score badge (first in source order) would
           otherwise land alone on its own wrapped line at the very top of
           the HUD, costing the board a whole row of vertical space just to
           show one small badge. Reordering the flex children (without
           touching the DOM) puts the controls first and pulls both score
           badges into a shared order group right after them, so they wrap
           onto the same line together, lower down, next to each other. */
        @media (max-width: 600px), (orientation: landscape) and (max-height: 500px) {
            .hud-controls { order: 1; }
            .score-badge { order: 2; }
        }

        .board-container {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: clamp(4px, 1.5vh, 14px);
            width: 100%;
            max-width: 900px;
            padding: clamp(6px, 2.5vw, 20px);
            box-sizing: border-box;
            overflow: hidden;
        }

        /* Card Styling */
        .hand {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            flex-wrap: nowrap;
        }

        /* Every .card gets its width from --card-w, which defaults to the
           table/deck size and is overridden per-context below. Height is
           derived from width via aspect-ratio so cards never distort. */
        .card {
            --card-w: var(--table-card-w);
            width: var(--card-w);
            aspect-ratio: 96 / 174;
            height: auto;
            background: transparent; 
            border-radius: 8px;
            position: relative;
            cursor: pointer;
            box-shadow: -2px 5px 15px rgba(0,0,0,0.4);
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.25s;
            user-select: none;
            margin: 0 clamp(2px, 1vw, 5px);
            overflow: hidden; 
        }

        /* The player's hand is what people actually need to tap, so it
           always gets the biggest cards on screen. */
        #player-hand .card {
            --card-w: var(--player-card-w);
        }

        /* The AI's hand is just face-down backs for reference, so it can
           stay smaller and free up room for the player's cards. */
        #ai-hand .card {
            --card-w: var(--ai-card-w);
        }

        .card:hover {
            transform: translateY(-15px) scale(1.05);
            box-shadow: 0 15px 25px rgba(0,0,0,0.6);
            z-index: 10;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: contain; 
            display: block;
            pointer-events: none; 
            border-radius: 8px;
            transform: scale(1.04); 
        }

        /* --- PURE CSS EMOJI CARDS --- */
        .emoji-style {
            width: 100%;
            height: 100%;
            background: #fdfbf7;
            border: 4px solid #fff;
            border-radius: 8px;
            box-sizing: border-box;
            position: relative;
            display: flex;
            flex-direction: column;
            font-family: 'Georgia', serif;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }
        
        .emoji-style .corner {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: clamp(9px, calc(var(--card-w) * 0.155), 16px);
            font-weight: bold;
            padding: clamp(2px, calc(var(--card-w) * 0.06), 6px);
            line-height: 1.1;
        }
        
        .emoji-style .corner.top-left { top: 0; left: 0; }
        .emoji-style .corner.bottom-right { bottom: 0; right: 0; transform: rotate(180deg); }
        
        .emoji-style .center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: clamp(18px, calc(var(--card-w) * 0.42), 42px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .emoji-style .center .main-rank {
            font-size: clamp(9px, calc(var(--card-w) * 0.175), 18px);
            font-weight: bold;
            margin-top: -5px;
            text-shadow: none;
        }

        .emoji-style.coins { color: #d35400; }
        .emoji-style.cups { color: #c0392b; }
        .emoji-style.swords { color: #2980b9; }
        .emoji-style.clubs { color: #27ae60; }

        /* Card Back */
        .card.back {
            background: 
                repeating-linear-gradient(45deg, transparent, transparent 5px, rgba(255,255,255,0.15) 5px, rgba(255,255,255,0.15) 10px),
                repeating-linear-gradient(-45deg, transparent, transparent 5px, rgba(255,255,255,0.15) 5px, rgba(255,255,255,0.15) 10px),
                #b71c1c;
            border: 4px solid #fdfbf7;
            box-sizing: border-box;
            cursor: default;
        }
        
        .card.back:hover {
            transform: none;
            box-shadow: -2px 5px 15px rgba(0,0,0,0.4);
        }

        /* Middle Play Area */
        .middle-area {
            display: flex;
            justify-content: center;
            align-items: center;
            height: auto;
            width: 100%; 
        }
        
        .middle-area > div {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .deck-area {
            position: relative;
            width: clamp(96px, 32vw, 190px);
            aspect-ratio: 190 / 180;
            height: auto;
            /* Spacing to the table lives here (not on .middle-area's gap)
               so it can collapse to 0 together with the width once the
               deck is empty, fully reclaiming the space for the table. */
            margin-right: clamp(6px, 3vw, 24px);
            transition: width 0.6s ease, margin-right 0.6s ease, opacity 0.5s ease;
        }

        /* Once the deck (and trump card) are fully drawn, the deck area
           has nothing left to show for the rest of the hand — collapse it
           so the table area can grow into the freed space. */
        .middle-area.deck-exhausted .deck-area {
            width: 0;
            margin-right: 0;
            opacity: 0;
            pointer-events: none;
        }

        #briscola-card, #deck-stack {
            --card-w: var(--table-card-w);
        }

        #briscola-card {
            position: absolute;
            left: 26%;
            top: 16%;
            transform: rotate(90deg);
            z-index: 0;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.5);
        }
        
        #briscola-card:hover { transform: rotate(90deg); }

        #deck-stack {
            position: absolute;
            left: 0;
            top: 0;
            z-index: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .deck-counter-badge {
            position: absolute;
            bottom: -10px;
            right: -10px;
            background: #e74c3c;
            color: white;
            font-weight: bold;
            font-size: 12px;
            padding: 5px 8px;
            border-radius: 50%;
            border: 2px solid white;
            z-index: 2;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .table-area {
            display: flex;
            justify-content: center;
            align-items: center;
            width: clamp(150px, 54vw, 320px);
            aspect-ratio: 320 / 230;
            height: auto;
            border-radius: 100px;
            background: rgba(0,0,0,0.15);
            border: 2px dashed rgba(255, 215, 0, 0.2);
            position: relative;
            transition: width 0.6s ease;
        }

        /* Grow the table into the space the deck area just vacated. */
        .middle-area.deck-exhausted .table-area {
            width: clamp(200px, 74vw, 480px);
        }
        
        .table-area .card {
            position: absolute;
        }
        
        .table-area .card:hover { transform: none !important; cursor: default; }

        .status-board {
            font-size: clamp(0.75em, 2.8vw, 1.2em);
            margin-top: clamp(4px, 1.5vh, 10px);
            padding: clamp(6px, 1.5vh, 10px) clamp(14px, 4vw, 30px);
            background: rgba(0,0,0,0.7);
            border-radius: 30px;
            display: inline-block;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* Session Stats Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(3px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            z-index: 1000;
        }

        .modal-overlay.collapsed {
            display: none;
        }

        .modal-panel {
            background: #123F17;
            border: 1px solid rgba(255, 215, 0, 0.35);
            border-radius: 18px;
            padding: clamp(18px, 4vw, 28px);
            width: 100%;
            max-width: min(340px, 92vw);
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.6);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: clamp(12px, 3vh, 18px);
        }

        .modal-header h2 {
            margin: 0;
            font-size: clamp(16px, 4vw, 20px);
            letter-spacing: 1px;
        }

        .modal-close-btn {
            padding: 4px 11px !important;
            font-size: 16px !important;
            line-height: 1;
            border-radius: 50% !important;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 18px;
        }

        .stat-item {
            background: rgba(0, 0, 0, 0.35);
            border-radius: 12px;
            padding: 10px 8px;
            text-align: center;
        }

        .stat-item .stat-label {
            display: block;
            font-size: clamp(10px, 2.6vw, 12px);
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.8;
            margin-bottom: 4px;
        }

        .stat-item .stat-value {
            display: block;
            font-size: clamp(18px, 5vw, 24px);
            font-weight: bold;
        }

        .clear-btn {
            background: rgba(231, 76, 60, 0.2);
            border: 1px solid rgba(231, 76, 60, 0.5);
            padding: 8px 10px;
            font-size: 13px;
            width: 100%;
        }

        .clear-btn:hover {
            background: rgba(231, 76, 60, 0.5);
        }

        /* Phones in portrait. The player's own cards are what they need to
           see clearly and tap accurately, but --player-card-w's general
           96px ceiling (sized for tablets/desktops too) was reached by
           most phone widths well before the layout ran out of room,
           leaving visible empty space above and on either side of the
           hand. Raise that ceiling so the cards grow into that unused
           space. This only changes card size — .board-container's normal
           flex flow means the hand simply shrinks the gap above it as it
           grows, it can never overlap the turn-status text above; and if
           an unusually short/narrow device would ever run out of vertical
           room, fitToViewport() (JS) uniformly scales the whole board down
           to keep everything fully visible and non-overlapping. */
        @media (max-width: 600px) {
            :root {
                --player-card-w: clamp(88px, 28vw, 128px);
            }
        }

        /* Short viewports (phones in landscape) have very little vertical
           room. Compress the chrome (HUD/stats/status) and shrink cards
           further so the player's hand is never pushed off-screen. */
        @media (orientation: landscape) and (max-height: 500px) {
            :root {
                --player-card-w: clamp(56px, 19vh, 90px);
                --ai-card-w: clamp(28px, 9vh, 52px);
                --table-card-w: clamp(30px, 10vh, 60px);
            }
            .hud { padding: 4px 6px; gap: 6px; }
            .hud-controls { gap: 6px; }
            .control-group label { display: none; }
            .score-badge { padding: 4px 10px; font-size: 12px; }
            select, button { padding: 4px 8px; font-size: 11px; }
            .status-board { padding: 3px 12px; margin-top: 2px; font-size: 0.65em; }
            .board-container { gap: 4px; padding: 4px 8px; }
            /* Drive these off height instead of width: landscape phones
               have width to spare but almost no vertical room, so let
               aspect-ratio compute width from a height budget instead. */
            .deck-area { width: auto; height: clamp(56px, 20vh, 180px); margin-right: 6px; }
            .table-area { width: auto; height: clamp(56px, 20vh, 230px); }

            /* Collapsing horizontally doesn't free vertical room here, but
               keep the deck area fully gone and give the table a modest
               height bump so growth still reads as intentional. */
            .middle-area.deck-exhausted .deck-area {
                width: 0;
                height: 0;
                margin-right: 0;
                opacity: 0;
            }
            .middle-area.deck-exhausted .table-area {
                width: auto;
                height: clamp(56px, 23vh, 260px);
            }
        }

        /* Large desktop & laptop monitors. Card sizing tops out at the
           original 96px width above (matching the pre-mobile-optimization
           desktop design), which already saturates on any normal laptop
           screen and never grows further no matter how big the monitor
           gets. These min-width tiers let cards — and the table/deck area
           they sit in, and the overall board — keep scaling up on genuinely
           large screens. Purely additive: the thresholds start well above
           any phone or tablet width, so nothing below 1600px changes. */
        @media (min-width: 1600px) {
            :root {
                --player-card-w: clamp(76px, min(24vw, 30vh), 128px);
                --ai-card-w: clamp(46px, min(13vw, 17vh), 128px);
                --table-card-w: clamp(52px, min(15vw, 19vh), 128px);
            }
            .board-container { max-width: 1150px; }
            .deck-area { width: clamp(96px, 32vw, 240px); margin-right: clamp(6px, 3vw, 32px); }
            .table-area { width: clamp(150px, 54vw, 420px); }
            .middle-area.deck-exhausted .table-area { width: clamp(200px, 74vw, 560px); }
            .deck-counter-badge { font-size: 16px; padding: 7px 10px; }
        }

        /* ~2560px-class displays (WQHD monitors, etc). */
        @media (min-width: 2560px) {
            :root {
                --player-card-w: clamp(76px, min(24vw, 30vh), 156px);
                --ai-card-w: clamp(46px, min(13vw, 17vh), 156px);
                --table-card-w: clamp(52px, min(15vw, 19vh), 156px);
            }
            .board-container { max-width: 1400px; }
            .deck-area { width: clamp(96px, 32vw, 290px); margin-right: clamp(6px, 3vw, 38px); }
            .table-area { width: clamp(150px, 54vw, 500px); }
            .middle-area.deck-exhausted .table-area { width: clamp(200px, 74vw, 660px); }
            .deck-counter-badge { font-size: 19px; padding: 8px 12px; }
        }

        /* 4K / UHD (3840x2160) and beyond. */
        @media (min-width: 3400px) {
            :root {
                --player-card-w: clamp(76px, min(24vw, 30vh), 190px);
                --ai-card-w: clamp(46px, min(13vw, 17vh), 190px);
                --table-card-w: clamp(52px, min(15vw, 19vh), 190px);
            }
            .board-container { max-width: 1700px; }
            .deck-area { width: clamp(96px, 32vw, 350px); margin-right: clamp(6px, 3vw, 46px); }
            .table-area { width: clamp(150px, 54vw, 600px); }
            .middle-area.deck-exhausted .table-area { width: clamp(200px, 74vw, 800px); }
            .deck-counter-badge { font-size: 23px; padding: 10px 14px; }
        }
    </style>
</head>
<body>

<div id="viewport-fit">

<div class="hud">
    <div class="score-badge">AI: <span id="ai-score">0</span></div>
    
    <div class="hud-controls">
        <div class="control-group">
            <label for="card-style-select">Style:</label>
            <select id="card-style-select" onchange="changeCardStyle()">
                <option value="images">Images</option>
                <option value="emojis">Emojis</option>
            </select>
        </div>

        <div class="control-group">
            <label for="difficulty-select">AI Level:</label>
            <select id="difficulty-select" onchange="changeDifficulty()">
                <option value="easy">Easy (Random)</option>
                <option value="medium">Medium (Heuristic)</option>
                <option value="hard">Hard (Strategic)</option>
            </select>
        </div>

        <button onclick="resetGame()">Deal New Game</button>
        <button onclick="openStatsModal()">📊 Stats</button>
    </div>

    <div class="score-badge" style="color: #ffd700;">YOU: <span id="player-score">0</span></div>
</div>

<div class="board-container">
    <div class="hand" id="ai-hand"></div>

    <div class="middle-area">
    
    <div>
        <div class="deck-area">
            <div id="briscola-card" class="card"></div>
            <div id="deck-stack-container" style="position: relative;">
                <div id="deck-stack" class="card back"></div>
                <div id="deck-count-badge" class="deck-counter-badge"></div>
            </div>
        </div>
    </div>

    <div>
        <div class="table-area" id="table"></div>
        <div class="status-board" id="status" style="max-width: min(280px, 80vw); white-space: normal; text-align: center;">Starting game...</div>
    </div>

</div>

    <div class="hand" id="player-hand"></div>
</div>

</div>

<div class="modal-overlay collapsed" id="stats-modal-overlay" onclick="handleOverlayClick(event)">
    <div class="modal-panel">
        <div class="modal-header">
            <h2>Session Stats</h2>
            <button class="modal-close-btn" onclick="closeStatsModal()">✕</button>
        </div>
        <div class="stats-grid">
            <div class="stat-item">
                <span class="stat-label">Games</span>
                <span class="stat-value" id="stat-games">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Win Rate</span>
                <span class="stat-value" id="stat-rate">0%</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Wins</span>
                <span class="stat-value" id="stat-wins" style="color: #4cd137;">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Losses</span>
                <span class="stat-value" id="stat-losses" style="color: #e84118;">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Ties</span>
                <span class="stat-value" id="stat-ties" style="color: #fbc531;">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">High Score</span>
                <span class="stat-value" id="stat-high" style="color: #ffd700;">0</span>
            </div>
            <div class="stat-item" style="grid-column: 1 / -1;">
                <span class="stat-label">Average Score</span>
                <span class="stat-value" id="stat-avg">0</span>
            </div>
        </div>
        <button onclick="clearStats()" class="clear-btn">Reset Stats</button>
    </div>
</div>

<script>
    const suits = ['Coins', 'Cups', 'Swords', 'Clubs'];
    const ranks = [
        { name: 'Ace', val: 11, power: 10 },
        { name: '3', val: 10, power: 9 },
        { name: 'King', val: 4, power: 8 },
        { name: 'Knight', val: 3, power: 7 },
        { name: 'Jack', val: 2, power: 6 },
        { name: '7', val: 0, power: 5 },
        { name: '6', val: 0, power: 4 },
        { name: '5', val: 0, power: 3 },
        { name: '4', val: 0, power: 2 },
        { name: '2', val: 0, power: 1 }
    ];

    let deck = [], playerHand = [], aiHand = [], table = [];
    let playerScore = 0, aiScore = 0;
    let briscolaCard = null, briscolaSuit = '';
    let playerTurn = true; 
    let playerCanPlay = true; 
    let gameOver = false;
    let aiDifficulty = 'easy';
    let useEmojiCards = false;
    let gameId = 0; // bumped every new deal; lets in-flight timeouts detect a reset and bail out

    function changeDifficulty() {
        aiDifficulty = document.getElementById('difficulty-select').value;
        localStorage.setItem('briscolaDifficulty', aiDifficulty);
    }

    // Restores the last-played difficulty (if any) before the first game
    // is dealt, so the dropdown and aiDifficulty reflect last session
    // instead of always defaulting to "easy".
    function initDifficulty() {
        const savedDifficulty = localStorage.getItem('briscolaDifficulty');
        if (savedDifficulty) {
            aiDifficulty = savedDifficulty;
            document.getElementById('difficulty-select').value = savedDifficulty;
        }
    }
    
    function changeCardStyle() { 
        useEmojiCards = document.getElementById('card-style-select').value === 'emojis';
        render(); 
    }

    function resetGame() {
        playerHand = []; aiHand = []; table = [];
        playerScore = 0; aiScore = 0;
        playerTurn = true; playerCanPlay = true; gameOver = false;
        initGame();
    }

    function initGame() {
        gameId++; // invalidates any timeout/animation callbacks still in flight from a previous game
        deck = [];
        suits.forEach(suit => {
            ranks.forEach(rank => {
                deck.push({ suit: suit, name: rank.name, val: rank.val, power: rank.power });
            });
        });
        
        for (let i = deck.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [deck[i], deck[j]] = [deck[j], deck[i]];
        }

        for (let i = 0; i < 3; i++) {
            playerHand.push(deck.pop());
            aiHand.push(deck.pop());
        }

        briscolaCard = deck.pop();
        briscolaSuit = briscolaCard.suit;
        
        changeDifficulty();
        changeCardStyle();
        render();
        updateStatus("Your turn to lead!", "#4cd137");
    }

    function updateStatus(text, color = "white") {
        const statusEl = document.getElementById('status');
        statusEl.innerText = text;
        statusEl.style.color = color;
    }

    // --- ANIMATION CONTROLLERS ---

    function animateCardPlay(index, isPlayer, cardData, isFirstCard, targetRotation, callback) {
        const handDiv = isPlayer ? document.getElementById('player-hand') : document.getElementById('ai-hand');
        const sourceEl = handDiv.children[index];
        const startRect = sourceEl.getBoundingClientRect();

        const clone = document.createElement('div');
        clone.className = 'card';
        clone.innerHTML = renderCardHTML(cardData);

        clone.style.position = 'fixed';
        clone.style.top = startRect.top + 'px';
        clone.style.left = startRect.left + 'px';
        clone.style.zIndex = '9999';
        clone.style.margin = '0';
        clone.style.transition = 'all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)';

        sourceEl.style.opacity = '0';

        document.body.appendChild(clone);

        const tableDiv = document.getElementById('table');
        const tableRect = tableDiv.getBoundingClientRect();
        // Read the clone's actual on-screen size (cards scale responsively)
        // instead of assuming the old fixed 96x174 desktop dimensions.
        const cloneRect = clone.getBoundingClientRect();
        const halfW = cloneRect.width / 2;
        const halfH = cloneRect.height / 2;

        let offsetX = isPlayer ? -15 : 15;
        let shift = isFirstCard ? -25 : 25;
        let yOffset = isPlayer ? 10 : -10;

        let targetLeft = tableRect.left + (tableRect.width / 2) - halfW + shift + offsetX; 
        let targetTop = tableRect.top + (tableRect.height / 2) - halfH + yOffset; 

        clone.offsetHeight;

        clone.style.top = targetTop + 'px';
        clone.style.left = targetLeft + 'px';
        clone.style.transform = `rotate(${targetRotation}deg) scale(1.1)`; 
        
        setTimeout(() => {
            clone.remove();
            callback();
        }, 400);
    }

    function animateTrickClear(isPlayerWinner, callback) {
        const tableCards = document.querySelectorAll('#table .card');

        tableCards.forEach(card => {
            card.style.transition = 'all 0.5s ease-in';
            if (isPlayerWinner) {
                card.style.transform += ' translate(0, 500px)'; 
                card.style.opacity = '0';
            } else {
                card.style.transform += ' translate(0, -500px)'; 
                card.style.opacity = '0';
            }
        });

        setTimeout(() => {
            callback();
        }, 500);
    }

    // --- PLAY/RESOLVE LOGIC ---

    function playCard(index, isPlayer) {
        if (gameOver || (isPlayer && !playerCanPlay)) return;
        if (isPlayer) playerCanPlay = false; 

        let card = isPlayer ? playerHand[index] : aiHand[index];
        let isFirstCard = table.length === 0;
        let randomRotation = Math.floor(Math.random() * 40) - 20; 
        const thisGame = gameId; // snapshot so a "Deal New Game" click mid-animation can't corrupt the next game
        
        animateCardPlay(index, isPlayer, card, isFirstCard, randomRotation, () => {
            if (thisGame !== gameId) return; // a new game started while this card was flying to the table; drop it

            if (isPlayer) {
                playerHand.splice(index, 1);
            } else {
                aiHand.splice(index, 1);
            }
            
            table.push({ card: card, isPlayer: isPlayer, rotation: randomRotation });
            render();

            if (table.length === 2) {
                setTimeout(() => resolveTrick(thisGame), 1200); 
            } else {
                if (isPlayer) {
                    updateStatus("AI is thinking...", "#fbc531");
                    setTimeout(() => aiPlayCalculations(thisGame), 800); 
                } else {
                    playerCanPlay = true; 
                    updateStatus("Your turn to follow.", "#4cd137");
                }
            }
        });
    }

    function resolveTrick(gid) {
        if (gid !== gameId) return; // stale call from a game that's since been reset
        if (table.length < 2) return; // safety net: nothing valid on the table to resolve

        let lead = table[0];
        let follow = table[1];
        
        let winnerType = getWinner(lead.card, follow.card);
        let trickWinnerIsPlayer = (winnerType === 'lead') ? lead.isPlayer : follow.isPlayer;
        let points = lead.card.val + follow.card.val;
        
        animateTrickClear(trickWinnerIsPlayer, () => {
            if (gid !== gameId) return; // a reset happened during the clear-table animation

            if (trickWinnerIsPlayer) {
                playerScore += points;
                playerTurn = true;
                playerCanPlay = true;
            } else {
                aiScore += points;
                playerTurn = false;
            }
            
            table = [];
            drawCards();
            render();

            if (playerHand.length === 0 && aiHand.length === 0) {
                endGame();
            } else {
                if (!playerTurn) {
                    updateStatus("AI took the trick. Thinking...", "#e84118");
                    setTimeout(() => aiPlayCalculations(gid), 1000); 
                } else {
                    updateStatus("You took the trick! Your lead.", "#4cd137");
                }
            }
        });
    }

    // --- AI Engines ---
    function aiPlayCalculations(gid) {
        if (gid !== gameId || gameOver) return; // stale call from a game that's since been reset
        let chosenIndex = 0;
        
        if (aiDifficulty === 'easy') chosenIndex = Math.floor(Math.random() * aiHand.length);
        else if (aiDifficulty === 'medium') chosenIndex = getMediumAiChoice();
        else if (aiDifficulty === 'hard') chosenIndex = getHardAiChoice();
        
        playCard(chosenIndex, false);
    }

    function getWinner(leadCard, followCard) {
        if (followCard.suit === briscolaSuit && leadCard.suit !== briscolaSuit) return 'follow';
        if (leadCard.suit === briscolaSuit && followCard.suit !== briscolaSuit) return 'lead';
        if (leadCard.suit === followCard.suit) return leadCard.power > followCard.power ? 'lead' : 'follow';
        return 'lead';
    }

    function getMediumAiChoice() {
        if (table.length === 0) {
            let bestIndex = 0, lowestValue = Infinity;
            aiHand.forEach((card, index) => {
                let weight = card.val;
                if (card.suit === briscolaSuit) weight += 20; 
                if (weight < lowestValue) { lowestValue = weight; bestIndex = index; }
            });
            return bestIndex;
        } else {
            let playerCard = table[0].card;
            let winningCards = [], losingCards = [];
            aiHand.forEach((card, index) => {
                if (getWinner(playerCard, card) === 'follow') winningCards.push({ card, index });
                else losingCards.push({ card, index });
            });
            if (winningCards.length > 0 && (playerCard.val > 0 || winningCards.some(w => w.card.val > 0))) {
                winningCards.sort((a, b) => a.card.power - b.card.power);
                return winningCards[0].index;
            }
            if (losingCards.length === 0) losingCards = winningCards; // every card would win; just play the cheapest one
            losingCards.sort((a,b) => (a.card.val + (a.card.suit === briscolaSuit ? 20 : 0)) - (b.card.val + (b.card.suit === briscolaSuit ? 20 : 0)));
            return losingCards[0].index;
        }
    }

    function getHardAiChoice() {
        if (table.length === 0) {
            let nonBriscolas = aiHand.map((c, i) => ({c, i})).filter(item => item.c.suit !== briscolaSuit);
            if (nonBriscolas.length > 0) {
                nonBriscolas.sort((a, b) => a.c.val - b.c.val || a.c.power - b.c.power);
                return nonBriscolas[0].i;
            }
            aiHand.sort((a,b) => a.power - b.power);
            return 0; 
        } else {
            let playerCard = table[0].card;
            let totalPointsOnTable = playerCard.val;
            let choices = aiHand.map((card, index) => {
                let wins = getWinner(playerCard, card) === 'follow';
                return { card, index, wins, potentialPoints: totalPointsOnTable + card.val };
            });
            let winningChoices = choices.filter(c => c.wins);

            if (winningChoices.length > 0) {
                if (playerCard.val >= 10) {
                    let briscolaWins = winningChoices.filter(c => c.card.suit === briscolaSuit);
                    if (briscolaWins.length > 0) {
                        briscolaWins.sort((a, b) => a.card.power - b.card.power);
                        return briscolaWins[0].index; 
                    }
                }
                winningChoices.sort((a, b) => b.potentialPoints - a.potentialPoints);
                if (winningChoices[0].potentialPoints >= 4 || winningChoices[0].card.suit !== briscolaSuit) return winningChoices[0].index;
            }
            let losingChoices = choices.filter(c => !c.wins);
            if (losingChoices.length === 0) losingChoices = choices; 
            losingChoices.sort((a, b) => {
                let scoreA = a.card.val + (a.card.suit === briscolaSuit ? 50 : 0);
                let scoreB = b.card.val + (b.card.suit === briscolaSuit ? 50 : 0);
                return scoreA - scoreB;
            });
            return losingChoices[0].index;
        }
    }

    function drawCards() {
        if (deck.length > 0 || briscolaCard) {
            let drawForWinner = deck.length > 0 ? deck.pop() : briscolaCard;
            if (deck.length === 0 && drawForWinner === briscolaCard) briscolaCard = null;
            
            let drawForLoser = deck.length > 0 ? deck.pop() : briscolaCard;
            if (deck.length === 0 && drawForLoser === briscolaCard && briscolaCard !== null) briscolaCard = null;

            if (playerTurn) {
                if (drawForWinner) playerHand.push(drawForWinner);
                if (drawForLoser) aiHand.push(drawForLoser);
            } else {
                if (drawForWinner) aiHand.push(drawForWinner);
                if (drawForLoser) playerHand.push(drawForLoser);
            }
        }
    }

    function endGame() {
        gameOver = true;
            stats.games++;
            stats.totalScore = (stats.totalScore || 0) + playerScore;
            if (playerScore > (stats.highScore || 0)) {
                stats.highScore = playerScore;
            }
    
            let msg = "";
            let color = "";

            if (playerScore > aiScore) {
                msg = "YOU WIN!";
                color = "#4cd137";
                stats.wins++;
            } else if (playerScore < aiScore) {
                msg = "AI WINS!";
                color = "#e84118";
                stats.losses++;
            } else {
                msg = "IT'S A TIE!";
                color = "#fbc531";
                stats.ties++;
            }
    
            saveStats(); // Save and update the UI
            updateStatus(`GAME OVER! ${msg}`, color);
            }

    // --- VIEWPORT FIT (no-scroll guarantee) ---
    // The vh-based clamp sizing above fits comfortably on virtually every
    // real device, but a handful of unusually short/narrow viewports (e.g.
    // small phones with the stats panel open) can still need a hair more
    // room than is available. Rather than let that clip the player's own
    // hand off-screen (or fall back to a scrollbar), measure the board's
    // true natural height and, only if it doesn't fit, scale the whole
    // thing down uniformly so everything stays fully visible.
    function fitToViewport() {
        const wrapper = document.getElementById('viewport-fit');
        const playerHandEl = document.getElementById('player-hand');
        if (!wrapper || !playerHandEl) return;

        wrapper.style.transform = 'none'; // measure at natural (unscaled) size
        const naturalBottom = playerHandEl.getBoundingClientRect().bottom;
        const available = window.innerHeight;

        if (naturalBottom > available && naturalBottom > 0) {
            const scale = Math.min(1, (available / naturalBottom) * 0.99);
            wrapper.style.transform = `scale(${scale})`;
        }
    }

    window.addEventListener('resize', fitToViewport);
    window.addEventListener('orientationchange', fitToViewport);
    window.addEventListener('load', fitToViewport);

    // --- RENDER ENGINE ---
    function getCardImagePath(card) {
        let suitName = card.suit.toLowerCase();
        let rankName = card.name.toLowerCase();
        return `images/${suitName}_${rankName}.png`;
    }

    function renderCardHTML(card) {
        if (useEmojiCards) {
            let suitEmoji = '';
            let suitClass = card.suit.toLowerCase();
            if (card.suit === 'Coins') suitEmoji = '🪙';
            else if (card.suit === 'Cups') suitEmoji = '🍷';
            else if (card.suit === 'Swords') suitEmoji = '⚔️';
            else if (card.suit === 'Clubs') suitEmoji = '🏏';

            // Custom Rank Mapping for pure numbers + Ace
            let shortRank = card.name;
            if (card.name === 'Ace') shortRank = 'A';
            else if (card.name === 'Jack') shortRank = '11';
            else if (card.name === 'Knight') shortRank = '12';
            else if (card.name === 'King') shortRank = '13';

            return `
            <div class="emoji-style ${suitClass}">
                <div class="corner top-left">
                    <span class="rank">${shortRank}</span>
                </div>
                <div class="center">
                    <span class="main-emoji">${suitEmoji}</span>
                    <span class="main-rank">${shortRank}</span>
                </div>
                <div class="corner bottom-right">
                    <span class="rank">${shortRank}</span>
                </div>
            </div>`;
        } else {
            let imagePath = getCardImagePath(card);
            return `<img src="${imagePath}" alt="${card.name} of ${card.suit}" onerror="this.outerHTML='<div class=\\'image-fallback\\'>Missing<br>${card.name}<br>${card.suit}</div>'">`;
        }
    }

    function renderCardBackHTML() { return ``; }

    function render() {
        const aiHandDiv = document.getElementById('ai-hand');
        aiHandDiv.innerHTML = '';
        aiHand.forEach(() => {
            let div = document.createElement('div');
            div.className = 'card back';
            div.innerHTML = renderCardBackHTML();
            aiHandDiv.appendChild(div);
        });

        const playerHandDiv = document.getElementById('player-hand');
        playerHandDiv.innerHTML = '';
        playerHand.forEach((card, index) => {
            let div = document.createElement('div');
            div.className = 'card';
            div.innerHTML = renderCardHTML(card);
            div.onclick = () => playCard(index, true);
            playerHandDiv.appendChild(div);
        });

        const tableDiv = document.getElementById('table');
        tableDiv.innerHTML = '';
        table.forEach((item, index) => {
            let div = document.createElement('div');
            div.className = 'card';
            div.innerHTML = renderCardHTML(item.card);
            let offsetX = item.isPlayer ? -15 : 15;
            let shift = index === 0 ? -25 : 25; 
            div.style.transform = `translate(${shift + offsetX}px, ${item.isPlayer ? 10 : -10}px) rotate(${item.rotation}deg)`;
            tableDiv.appendChild(div);
        });

        const bCardDiv = document.getElementById('briscola-card');
        if (briscolaCard) {
            bCardDiv.style.display = 'block';
            bCardDiv.innerHTML = renderCardHTML(briscolaCard);
        } else {
            bCardDiv.style.display = 'none';
        }
        
        const deckStackDiv = document.getElementById('deck-stack');
        const deckBadge = document.getElementById('deck-count-badge');
        
        if (deck.length > 0) {
            deckStackDiv.style.display = 'flex';
            deckStackDiv.innerHTML = renderCardBackHTML();
            deckBadge.style.display = 'block';
            deckBadge.innerText = deck.length;
        } else {
            deckStackDiv.style.display = 'none';
            deckBadge.style.display = 'none';
        }

        // Once both the draw pile AND the trump card have been taken,
        // nothing is left to draw for the rest of the hand (the last 3
        // tricks are played straight from each player's remaining cards).
        // Collapse the now-empty deck area and let the table grow into
        // the space it freed up.
        const middleAreaDiv = document.querySelector('.middle-area');
        middleAreaDiv.classList.toggle('deck-exhausted', deck.length === 0 && !briscolaCard);

        document.getElementById('player-score').innerText = playerScore;
        document.getElementById('ai-score').innerText = aiScore;

        fitToViewport();
    }

    // --- SESSION STATS LOGIC ---
        const defaultStats = { wins: 0, losses: 0, ties: 0, games: 0, highScore: 0, totalScore: 0 };
        let stats = { ...defaultStats };

        function initStats() {
            const savedStats = localStorage.getItem('briscolaStats');
            if (savedStats) {
                // Merge with defaults so older saved stats (from before high
                // score/average tracking existed) still work correctly.
                stats = { ...defaultStats, ...JSON.parse(savedStats) };
            }
            updateStatsUI();
        }

        function saveStats() {
            localStorage.setItem('briscolaStats', JSON.stringify(stats));
            updateStatsUI();
        }

        function updateStatsUI() {
            document.getElementById('stat-games').innerText = stats.games;
            document.getElementById('stat-wins').innerText = stats.wins;
            document.getElementById('stat-losses').innerText = stats.losses;
            document.getElementById('stat-ties').innerText = stats.ties;
            document.getElementById('stat-high').innerText = stats.highScore;
    
            let winRate = stats.games > 0 ? Math.round((stats.wins / stats.games) * 100) : 0;
            document.getElementById('stat-rate').innerText = winRate + '%';

            let avgScore = stats.games > 0 ? Math.round(stats.totalScore / stats.games) : 0;
            document.getElementById('stat-avg').innerText = avgScore;
    }

        function clearStats() {
            stats = { ...defaultStats };
            saveStats();
        }

        // --- STATS MODAL ---
        function openStatsModal() {
            document.getElementById('stats-modal-overlay').classList.remove('collapsed');
        }

        function closeStatsModal() {
            document.getElementById('stats-modal-overlay').classList.add('collapsed');
        }

        // Clicking the dimmed backdrop (but not the panel itself) closes the modal.
        function handleOverlayClick(event) {
            if (event.target.id === 'stats-modal-overlay') closeStatsModal();
        }

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') closeStatsModal();
        });

    initStats();
    initDifficulty();
    initGame();
</script>
</body>
